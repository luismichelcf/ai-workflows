name: check

# The engine runs where its users run it. It was written and tested on Windows; the first run on
# Linux (the release workflow of v0.1.0) found two tests whose setup only held on Windows. Every
# pull request and every push to main now runs typecheck and tests on both.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # How pnpm is installed on this machine: the engine must find the real program behind it
      # without a shell, and shim shapes differ between installers.
      - name: Show how pnpm is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command pnpm -All | Format-Table -AutoSize CommandType, Source
          foreach ($cmd in Get-Command pnpm -All) {
            if ($cmd.Source -match '\.(cmd|ps1)$') {
              Write-Output "----- $($cmd.Source)"
              Get-Content $cmd.Source -TotalCount 40
            }
          }
          Write-Output "PATH:"
          $env:PATH -split ';' | Select-Object -First 25

      - name: Typecheck and test
        run: pnpm check
