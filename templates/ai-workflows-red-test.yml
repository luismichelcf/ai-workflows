# The unprivileged `ai-workflows/red-test` job (PLAN-13-R3 §5 and §6). It runs on `pull_request`
# and `merge_group`, not on `pull_request_target`: unlike the judge, THIS run executes the pull
# request's code (the tests it brings), so its YAML comes from the pull request itself and it has
# no permission to publish statuses: `statuses` is not in its permission list and its token cannot
# write one. The isolation comes from the permissions, not from trusting the branch.
#
# This workflow does NOT check out the judge's YAML: the ai-workflows action only checks the red
# test; the `ai-workflows` workflow publishes the verdict with its own status. The judge counts
# this check only when it can tie that exact check run to a job of THIS file, as it exists on the
# trusted base, run for this pull request and its current base (PLAN-13-R6 §7): a job with the
# same name in another workflow never counts.
#
# A pull request into a working branch of the recipe (`branches.into`) is tested against that
# branch's tip, with that branch's recipe (PLAN-13-R6 §1.2).
#
# `init` pins the engine action by its sealed SHA (where the template says <ENGINE_SHA>). The
# project's install steps are an example: adjust them to your package manager and test command.

name: ai-workflows red-test

on:
  # `edited` runs the red test again when a pull request changes its target branch (§3.1): without
  # it, a pull request retargeted to another branch would keep the result of the branch it pointed
  # to before.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  # This is the name of the required check: the judge looks for it as `ai-workflows/red-test`.
  red-test:
    name: ai-workflows/red-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No `statuses: write` on purpose: even if this job asked for it, its token cannot publish
    # statuses. It is the guarantee of SV-09 against a pull request that tried to approve itself.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The pull request's head (or the group SHA in the queue) is checked out, with its full
      # history and without keeping the token, so the test processes do not inherit it through the
      # git configuration.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # EXAMPLE to adjust: the steps your project installs its dependencies with. The red test runs
      # against the base using the head's dependencies, so they must be installed.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      # The action only checks the red test; it publishes no status (it has no permission to).
      - uses: luismichelcf/ai-workflows@<ENGINE_SHA>
        with:
          task: red-test
          token: ${{ github.token }}
