# The ai-workflows review signal (PLAN-13-R5 §2.6). It exists only to finish: its one job is that
# GitHub records a run of the `pull_request_review` event, so that the judge, which follows it
# through `workflow_run`, looks at the pull request again when the owner presses "Approve" (or when
# a review is dismissed). It grants no new power: it does not fetch the repository, does not read
# the pull request, uses neither secrets nor the app's token, and carries no template expression
# that could come from the pull request's content. The judge never trusts this run: it reads the
# pull request again on its own and judges it with the recipe of its trusted base, the tip of the
# branch it targets (the main branch, or a working branch of `branches.into`; PLAN-13-R6 §1.2).
#
# WHY A SEPARATE WORKFLOW. A `pull_request_review` would run the YAML of the pull request's merge
# commit, not the main branch's; with this minimal signal the judge always runs its own YAML (the
# main branch's), which is the only one it trusts.
#
# PROTECTION. The engine itself protects this file: it is on its fixed list of own files
# (PLAN-13-R6 §2.1), so a pull request that changes it without the owner's attestation is rejected.
# Even so, a pull request of the same repository can alter this signal and that version runs; it
# gains no power it did not already have (it can add any workflow with `pull_request`), and the
# judge does not trust the signal: it only uses its pull request number as a hint and reads
# everything again. Its two possible effects are waiting (the safe side) or imitating a judge
# status, which the trace reports (R13).

name: ai-workflows review signal

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  signal:
    name: Señal de revisión (inocua)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Terminar sin hacer nada
        run: echo "ai-workflows review signal"
